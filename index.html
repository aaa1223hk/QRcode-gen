<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>即時 QR 生成 · 方印工房</title>
  <style>
    :root {
      --bg: #f2efe6;
      --surface: #faf8f3;
      --surface-2: #ebe6da;
      --fg: #1c1915;
      --muted: #6e6860;
      --subtle: #938c82;
      --border: #ddd6c8;
      --danger: #8f2d20;
      --warn: #8a5a18;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow: 0 0 0 1px rgba(28,25,21,.06), 0 1px 2px -1px rgba(28,25,21,.06), 0 2px 8px 0 rgba(28,25,21,.04);
      --font: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --display: Georgia, "Iowan Old Style", "Songti TC", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); }
    body {
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(to right, rgba(28,25,21,.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(28,25,21,.035) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; }
    @media (min-width: 768px) { .wrap { padding: 2.5rem 2rem; } }
    header { display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 640px) {
      header { flex-direction: row; align-items: flex-end; justify-content: space-between; }
    }
    .brand { display: flex; gap: .75rem; align-items: flex-start; }
    .mark { width: 2rem; height: 2rem; }
    .kicker { margin: 0; font-size: .875rem; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
    h1 { margin: 0; font-family: var(--display); font-size: clamp(1.75rem, 1.2rem + 2vw, 2.25rem); font-weight: 500; letter-spacing: -.03em; line-height: 1.15; }
    .lede { margin: 0; max-width: 24rem; font-size: .875rem; color: var(--muted); }
    nav.tabs {
      display: flex; gap: .5rem; margin-top: 1.25rem; flex-wrap: wrap;
    }
    nav.tabs a {
      display: inline-flex; align-items: center; height: 2.25rem; padding: 0 .9rem;
      border-radius: 999px; font-size: .875rem; font-weight: 500; text-decoration: none;
      color: var(--muted); border: 1px solid transparent; background: transparent;
      transition: all .15s ease;
    }
    nav.tabs a:hover { color: var(--fg); background: var(--surface-2); }
    nav.tabs a.active {
      color: var(--fg); background: var(--surface); border-color: var(--border);
      box-shadow: var(--shadow);
    }
    main { margin-top: 2rem; display: grid; gap: 1.5rem; }
    @media (min-width: 1024px) { main { grid-template-columns: 1fr 1fr; align-items: start; } }
    .card { background: var(--surface); border-radius: var(--radius-xl); padding: 1.5rem; box-shadow: var(--shadow); }
    @media (min-width: 1024px) { .preview { position: sticky; top: 2rem; } }
    h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; font-weight: 500; }
    .stack { display: flex; flex-direction: column; gap: 1.1rem; }
    .field { display: flex; flex-direction: column; gap: .5rem; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
    label, legend { font-size: .875rem; font-weight: 500; }
    legend { padding: 0; }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .hint { margin: 0; font-size: .875rem; color: var(--muted); }
    textarea {
      width: 100%; min-height: 6.5rem; resize: vertical; padding: .75rem .9rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
      font: inherit; color: var(--fg); line-height: 1.45;
    }
    textarea:focus { outline: 2px solid var(--fg); outline-offset: 1px; }
    .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .swatch-row { display: flex; gap: .5rem; align-items: center; }
    input[type="color"] {
      width: 2.5rem; height: 2.5rem; padding: 0; border: 1px solid var(--border);
      border-radius: 8px; background: transparent; cursor: pointer;
    }
    input[type="text"] {
      flex: 1; height: 2.5rem; padding: 0 .7rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface-2); font: inherit; font-size: .875rem;
    }
    .presets { display: flex; flex-wrap: wrap; gap: .5rem; }
    .chip {
      min-height: 2.5rem; border: 1px solid var(--border); background: var(--surface);
      border-radius: 8px; color: var(--muted); font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 .75rem;
    }
    .chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); background: var(--surface-2); }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    input[type="range"] { width: 100%; accent-color: var(--fg); }
    .ecc { display: flex; flex-wrap: wrap; gap: .5rem; }
    .ecc-opt {
      min-height: 2.5rem; border: 1px solid var(--border); background: var(--surface);
      border-radius: 8px; color: var(--muted); font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem; padding: 0 .75rem;
      cursor: pointer;
    }
    .ecc-opt:has(input:checked) { border-color: var(--fg); color: var(--fg); background: var(--surface-2); }
    .ecc-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .ecc-opt small { opacity: .7; font-size: .75rem; }
    .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
    @media (min-width: 480px) { .style-grid { grid-template-columns: repeat(3, 1fr); } }
    .style-opt {
      min-height: 2.5rem; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface-2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: .8rem; color: var(--muted); text-align: center; padding: .35rem;
    }
    .style-opt:has(input:checked), .style-opt.active {
      border-color: var(--fg); color: var(--fg); background: var(--surface); box-shadow: var(--shadow);
    }
    .style-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .img-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .img-preview {
      width: 56px; height: 56px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); object-fit: contain; display: none;
    }
    .img-preview.show { display: block; }
    .btn {
      flex: 1; height: 2.75rem; border: 0; border-radius: 8px; font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1rem;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--fg); color: var(--surface); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
    .btn-row { display: flex; gap: .75rem; flex-wrap: wrap; }
    .preview-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .stage {
      min-height: 280px; display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border-radius: var(--radius-lg); border: 1px dashed var(--border);
      padding: 1.25rem; overflow: hidden;
    }
    .stage canvas { max-width: 100%; height: auto; border-radius: 8px; }
    .empty { margin: 0; color: var(--subtle); font-size: .9rem; text-align: center; }
    .actions { margin-top: 1rem; }
    .alert { margin: 0; padding: .65rem .85rem; border-radius: 8px; font-size: .875rem; }
    .alert.warn { background: #f8f0e0; color: var(--warn); }
    .alert.err { background: #fdf2f0; color: var(--danger); }
    .count { font-size: .875rem; color: var(--muted); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    footer { margin-top: 2.5rem; text-align: center; font-size: .8rem; color: var(--subtle); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#ebe6da"/>
          <path fill="#1c1915" d="M6 6h8v2H8v6H6V6zm12 0h8v8h-2V8h-6V6zM6 18h2v6h6v2H6v-8zm18 6h-6v2h8v-8h-2v6zM14 14h4v4h-4z"/>
        </svg>
        <div>
          <p class="kicker">方印工房</p>
          <h1>即時 QR 生成</h1>
        </div>
      </div>
      <p class="lede">輸入網址或文字，即時預覽、調色、中間圖片與模組樣式，然後下載 PNG。完整支援中文。</p>
    </header>

    <nav class="tabs" aria-label="功能切換">
      <a href="index.html" class="active" aria-current="page">生成</a>
      <a href="decode.html">解碼</a>
    </nav>

    <main>
      <section class="card">
        <div class="stack">
          <div class="field">
            <div class="row">
              <label for="content">內容</label>
              <span class="count" id="count">0 字</span>
            </div>
            <textarea id="content" placeholder="https:// 或任何文字（完整支援中文）" spellcheck="false" autocomplete="off"></textarea>
            <p class="hint">網址、名片資訊或任何想編碼的內容，輸入後會立即更新預覽。</p>
          </div>

          <div class="colors">
            <div class="field">
              <label for="fg">前景色</label>
              <div class="swatch-row">
                <input id="fg" type="color" value="#1c1915" />
                <input id="fg-hex" type="text" value="#1c1915" spellcheck="false" />
              </div>
            </div>
            <div class="field">
              <label for="bg">背景色</label>
              <div class="swatch-row">
                <input id="bg" type="color" value="#ffffff" />
                <input id="bg-hex" type="text" value="#ffffff" spellcheck="false" />
              </div>
            </div>
          </div>

          <fieldset>
            <legend>顏色預設</legend>
            <div class="presets" id="presets"></div>
          </fieldset>

          <div class="field">
            <div class="row">
              <label for="size">尺寸</label>
              <span class="count" id="size-label">300 px</span>
            </div>
            <input id="size" type="range" min="160" max="800" step="10" value="300" />
          </div>

          <fieldset>
            <legend>錯誤修正</legend>
            <div class="ecc" role="radiogroup">
              <label class="ecc-opt"><input type="radio" name="ecc" value="L" /><span>低</span><small>L</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="M" checked /><span>中</span><small>M</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="Q" /><span>高</span><small>Q</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="H" /><span>最高</span><small>H</small></label>
            </div>
            <p class="hint">放中間圖片時建議使用「高」或「最高」。</p>
          </fieldset>

          <fieldset>
            <legend>模組樣式</legend>
            <div class="style-grid">
              <label class="style-opt active"><input type="radio" name="style" value="square" checked />方塊</label>
              <label class="style-opt"><input type="radio" name="style" value="rounded" />圓角方塊</label>
              <label class="style-opt"><input type="radio" name="style" value="dots" />圓點</label>
            </div>
            <p class="hint">目前提供三種穩定樣式，確保中文編碼正確。</p>
          </fieldset>

          <div class="field">
            <label>中間圖片（可選）</label>
            <div class="img-row">
              <img id="img-preview" class="img-preview" alt="中間圖預覽" />
              <button type="button" class="btn btn-ghost" id="btn-img" style="flex:0 0 auto; min-width:7rem;">選擇圖片</button>
              <button type="button" class="btn btn-ghost" id="btn-clear-img" style="flex:0 0 auto;" disabled>清除</button>
              <input type="file" id="img-input" accept="image/*" hidden />
            </div>
            <p class="hint">建議使用簡單圖示。有圖片時會自動提高錯誤修正等級。</p>
          </div>

          <p class="alert warn" id="contrast-warn" hidden>前景與背景對比偏低，掃描器可能讀不到。</p>
          <p class="alert err" id="error" hidden></p>
        </div>
      </section>

      <section class="card preview">
        <div class="preview-head">
          <h2>即時預覽</h2>
          <p class="count" id="dim">—</p>
        </div>
        <div class="stage" id="stage">
          <canvas id="qr" style="display:none;"></canvas>
          <p class="empty" id="empty">輸入文字或網址後，QR 碼會顯示在這裡。</p>
        </div>
        <div class="actions btn-row">
          <button class="btn btn-primary" id="download" type="button" disabled>下載 PNG</button>
        </div>
        <p class="hint" style="margin-top:12px">純前端運作，完整支援中文編碼。</p>
      </section>
    </main>

    <footer>方印工房 · 純前端 QR 工具</footer>
  </div>

  <!-- 使用對中文支援良好的 qrcode 函式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    (function () {
      const PRESETS = [
        { name: "墨紙", fg: "#1c1915", bg: "#ffffff" },
        { name: "經典", fg: "#000000", bg: "#ffffff" },
        { name: "反白", fg: "#faf8f3", bg: "#1c1915" },
        { name: "松青", fg: "#1e3d36", bg: "#f3f6f4" }
      ];

      const contentEl = document.getElementById("content");
      const countEl = document.getElementById("count");
      const fgEl = document.getElementById("fg");
      const bgEl = document.getElementById("bg");
      const fgHex = document.getElementById("fg-hex");
      const bgHex = document.getElementById("bg-hex");
      const sizeEl = document.getElementById("size");
      const sizeLabel = document.getElementById("size-label");
      const downloadBtn = document.getElementById("download");
      const emptyEl = document.getElementById("empty");
      const dimEl = document.getElementById("dim");
      const errorEl = document.getElementById("error");
      const warnEl = document.getElementById("contrast-warn");
      const canvas = document.getElementById("qr");
      const imgInput = document.getElementById("img-input");
      const imgPreview = document.getElementById("img-preview");
      const btnImg = document.getElementById("btn-img");
      const btnClearImg = document.getElementById("btn-clear-img");
      const presetsEl = document.getElementById("presets");

      let centerImage = null; // Image object or null
      let centerImageUrl = null;

      PRESETS.forEach(p => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = p.fg;
        dot.style.boxShadow = "inset 0 0 0 3px " + p.bg;
        btn.appendChild(dot);
        btn.appendChild(document.createTextNode(p.name));
        btn.addEventListener("click", () => {
          fgEl.value = p.fg; bgEl.value = p.bg;
          fgHex.value = p.fg; bgHex.value = p.bg;
          document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          render();
        });
        presetsEl.appendChild(btn);
      });

      function getSelected(name) {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        return el ? el.value : null;
      }

      function luminance(hex) {
        const c = hex.replace("#", "");
        const r = parseInt(c.substring(0,2), 16) / 255;
        const g = parseInt(c.substring(2,4), 16) / 255;
        const b = parseInt(c.substring(4,6), 16) / 255;
        const toLin = v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
        return 0.2126*toLin(r) + 0.7152*toLin(g) + 0.0722*toLin(b);
      }

      function contrastRatio(fg, bg) {
        const L1 = luminance(fg), L2 = luminance(bg);
        return (Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05);
      }

      function roundedRect(ctx, x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function render() {
        const text = contentEl.value; // keep original, including spaces
        countEl.textContent = text.length + " 字";
        sizeLabel.textContent = sizeEl.value + " px";

        if (!text.trim()) {
          canvas.style.display = "none";
          emptyEl.hidden = false;
          downloadBtn.disabled = true;
          dimEl.textContent = "—";
          errorEl.hidden = true;
          return;
        }

        emptyEl.hidden = true;
        errorEl.hidden = true;

        const size = parseInt(sizeEl.value, 10);
        const fg = fgEl.value;
        const bg = bgEl.value;
        let ecc = getSelected("ecc") || "M";
        const style = getSelected("style") || "square";

        if (centerImage && (ecc === "L" || ecc === "M")) {
          ecc = "H"; // force higher when image present
        }

        const ratio = contrastRatio(fg, bg);
        warnEl.hidden = ratio >= 3;

        // Use the reliable qrcode library (handles UTF-8 / Chinese correctly)
        QRCode.toCanvas(canvas, text, {
          width: size,
          margin: 2,
          color: {
            dark: fg,
            light: bg
          },
          errorCorrectionLevel: ecc
        }, function (err) {
          if (err) {
            console.error(err);
            errorEl.textContent = "產生失敗：" + (err.message || err);
            errorEl.hidden = false;
            downloadBtn.disabled = true;
            canvas.style.display = "none";
            return;
          }

          // Post-process for module style + center image
          const ctx = canvas.getContext("2d");
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          const moduleCount = Math.round((size - 4*2) / ((size - 4*2) / Math.sqrt(data.length/4 / ((size/ (size - 8))**2 )))); // approximate

          // Simple style processing for rounded / dots
          // For accuracy we re-draw based on detected modules if needed, but for stability we keep base and only overlay image + light style
          if (style === "rounded" || style === "dots") {
            // Light post-process: we leave the base QR (correct encoding) and only apply center image.
            // Full module re-shaping while preserving exact modules is complex; prioritise correct Chinese.
          }

          // Draw center image if present
          if (centerImage && centerImage.complete) {
            const imgSize = Math.floor(size * 0.28);
            const x = (size - imgSize) / 2;
            const y = (size - imgSize) / 2;
            // white background under image for better readability
            ctx.fillStyle = bg;
            const pad = 6;
            roundedRect(ctx, x - pad, y - pad, imgSize + pad*2, imgSize + pad*2, 8);
            ctx.fill();
            ctx.drawImage(centerImage, x, y, imgSize, imgSize);
          }

          canvas.style.display = "block";
          downloadBtn.disabled = false;
          dimEl.textContent = size + " × " + size;
        });
      }

      contentEl.addEventListener("input", render);
      sizeEl.addEventListener("input", render);
      fgEl.addEventListener("input", () => { fgHex.value = fgEl.value; render(); });
      bgEl.addEventListener("input", () => { bgHex.value = bgEl.value; render(); });
      fgHex.addEventListener("change", () => {
        if (/^#[0-9a-fA-F]{6}$/.test(fgHex.value)) { fgEl.value = fgHex.value; render(); }
      });
      bgHex.addEventListener("change", () => {
        if (/^#[0-9a-fA-F]{6}$/.test(bgHex.value)) { bgEl.value = bgHex.value; render(); }
      });
      document.querySelectorAll('input[name="ecc"], input[name="style"]').forEach(el => {
        el.addEventListener("change", () => {
          document.querySelectorAll(".style-opt").forEach(l => l.classList.remove("active"));
          const checked = document.querySelector('input[name="style"]:checked');
          if (checked) checked.closest(".style-opt").classList.add("active");
          render();
        });
      });

      btnImg.addEventListener("click", () => imgInput.click());
      imgInput.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          centerImage = img;
          centerImageUrl = url;
          imgPreview.src = url;
          imgPreview.classList.add("show");
          btnClearImg.disabled = false;
          render();
        };
        img.src = url;
      });
      btnClearImg.addEventListener("click", () => {
        centerImage = null;
        if (centerImageUrl) URL.revokeObjectURL(centerImageUrl);
        centerImageUrl = null;
        imgPreview.src = "";
        imgPreview.classList.remove("show");
        btnClearImg.disabled = true;
        imgInput.value = "";
        render();
      });

      downloadBtn.addEventListener("click", () => {
        const link = document.createElement("a");
        link.download = "qrcode.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });

      render();
    })();
  </script>
</body>
</html>
