<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即時 QR 生成 · 方印工房</title>
  <style>
    :root {
      --bg: #f2efe6;
      --surface: #faf8f3;
      --surface-2: #ebe6da;
      --fg: #1c1915;
      --muted: #6e6860;
      --subtle: #938c82;
      --border: #ddd6c8;
      --danger: #8f2d20;
      --warn: #8a5a18;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow: 0 0 0 1px rgba(28,25,21,.06), 0 1px 2px -1px rgba(28,25,21,.06), 0 2px 8px 0 rgba(28,25,21,.04);
      --font: "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --display: Georgia, "Iowan Old Style", "Songti TC", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg); }
    body {
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(to right, rgba(28,25,21,.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(28,25,21,.035) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button:not(:disabled) { cursor: pointer; }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; }
    @media (min-width: 768px) { .wrap { padding: 2.5rem 2rem; } }
    header { display: flex; flex-direction: column; gap: 1rem; }
    @media (min-width: 640px) {
      header { flex-direction: row; align-items: flex-end; justify-content: space-between; }
    }
    .brand { display: flex; gap: .75rem; align-items: flex-start; }
    .mark { width: 2rem; height: 2rem; }
    .kicker { margin: 0; font-size: .875rem; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
    h1 { margin: 0; font-family: var(--display); font-size: clamp(1.75rem, 1.2rem + 2vw, 2.25rem); font-weight: 500; letter-spacing: -.03em; line-height: 1.15; }
    .lede { margin: 0; max-width: 24rem; font-size: .875rem; color: var(--muted); }
    nav.tabs { display: flex; gap: .5rem; margin-top: 1.25rem; flex-wrap: wrap; }
    nav.tabs a {
      display: inline-flex; align-items: center; height: 2.25rem; padding: 0 .9rem;
      border-radius: 999px; font-size: .875rem; font-weight: 500; text-decoration: none;
      color: var(--muted); border: 1px solid transparent;
    }
    nav.tabs a:hover { color: var(--fg); background: var(--surface-2); }
    nav.tabs a.active {
      color: var(--fg); background: var(--surface); border-color: var(--border); box-shadow: var(--shadow);
    }
    main { margin-top: 2rem; display: grid; gap: 1.5rem; }
    @media (min-width: 1024px) { main { grid-template-columns: 1fr 1fr; align-items: start; } }
    .card { background: var(--surface); border-radius: var(--radius-xl); padding: 1.5rem; box-shadow: var(--shadow); }
    @media (min-width: 1024px) { .preview { position: sticky; top: 2rem; } }
    h2 { margin: 0 0 1rem; font-family: var(--display); font-size: 1.25rem; font-weight: 500; }
    .stack { display: flex; flex-direction: column; gap: 1.1rem; }
    .field { display: flex; flex-direction: column; gap: .5rem; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; }
    label, legend { font-size: .875rem; font-weight: 500; }
    fieldset { border: 0; margin: 0; padding: 0; }
    .hint { margin: 0; font-size: .875rem; color: var(--muted); }
    textarea {
      width: 100%; min-height: 6rem; resize: vertical; padding: .75rem .9rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
      font: inherit; color: var(--fg);
    }
    .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .swatch-row { display: flex; gap: .5rem; align-items: center; }
    input[type="color"] {
      width: 2.5rem; height: 2.5rem; padding: 0; border: 1px solid var(--border);
      border-radius: 8px; background: transparent; cursor: pointer;
    }
    input[type="text"] {
      flex: 1; height: 2.5rem; padding: 0 .7rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface-2); font: inherit; font-size: .875rem;
    }
    .presets { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .chip {
      min-height: 2.5rem; border: 1px solid var(--border); background: var(--surface);
      border-radius: 8px; color: var(--muted); font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: .5rem; padding: 0 .75rem;
    }
    .chip .dot { width: 12px; height: 12px; border-radius: 50%; }
    input[type="range"] { width: 100%; accent-color: var(--fg); }
    .ecc { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .ecc-opt {
      min-height: 2.5rem; border: 1px solid var(--border); background: var(--surface);
      border-radius: 8px; color: var(--muted); font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: .35rem; padding: 0 .75rem; cursor: pointer;
    }
    .ecc-opt:has(input:checked) { border-color: var(--fg); color: var(--fg); background: var(--surface-2); }
    .ecc-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .ecc-opt small { opacity: .7; font-size: .75rem; }
    .style-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .style-opt {
      min-height: 2.5rem; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface-2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: .8rem; color: var(--muted); padding: 0 .9rem;
    }
    .style-opt:has(input:checked) {
      border-color: var(--fg); color: var(--fg); background: var(--surface); box-shadow: var(--shadow);
    }
    .style-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .img-row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    .img-preview {
      width: 56px; height: 56px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); object-fit: contain; display: none;
    }
    .img-preview.show { display: block; }
    .btn {
      height: 2.75rem; border: 0; border-radius: 8px; font: inherit; font-size: .875rem; font-weight: 500;
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1rem;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--fg); color: var(--surface); }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .preview-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; }
    .stage {
      min-height: 280px; display: flex; align-items: center; justify-content: center;
      background: var(--surface-2); border-radius: var(--radius-lg); border: 1px dashed var(--border);
      padding: 1.25rem;
    }
    .stage canvas { max-width: 100%; height: auto; border-radius: 8px; }
    .empty { margin: 0; color: var(--subtle); font-size: .9rem; text-align: center; }
    .actions { margin-top: 1rem; }
    .alert { margin: 0; padding: .65rem .85rem; border-radius: 8px; font-size: .875rem; }
    .alert.warn { background: #f8f0e0; color: var(--warn); }
    .alert.err { background: #fdf2f0; color: var(--danger); }
    .count { font-size: .875rem; color: var(--muted); }
    footer { margin-top: 2.5rem; text-align: center; font-size: .8rem; color: var(--subtle); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#ebe6da"/>
          <path fill="#1c1915" d="M6 6h8v2H8v6H6V6zm12 0h8v8h-2V8h-6V6zM6 18h2v6h6v2H6v-8zm18 6h-6v2h8v-8h-2v6zM14 14h4v4h-4z"/>
        </svg>
        <div>
          <p class="kicker">方印工房</p>
          <h1>即時 QR 生成</h1>
        </div>
      </div>
      <p class="lede">輸入網址或文字，即時預覽、調色、中間圖片與模組樣式，然後下載 PNG。完整支援中文。</p>
    </header>

    <nav class="tabs">
      <a href="index.html" class="active">生成</a>
      <a href="decode.html">解碼</a>
    </nav>

    <main>
      <section class="card">
        <div class="stack">
          <div class="field">
            <div class="row">
              <label for="content">內容</label>
              <span class="count" id="count">0 字</span>
            </div>
            <textarea id="content" placeholder="輸入文字或網址（支援中文）" spellcheck="false"></textarea>
          </div>

          <div class="colors">
            <div class="field">
              <label for="fg">前景色</label>
              <div class="swatch-row">
                <input id="fg" type="color" value="#1c1915" />
                <input id="fg-hex" type="text" value="#1c1915" />
              </div>
            </div>
            <div class="field">
              <label for="bg">背景色</label>
              <div class="swatch-row">
                <input id="bg" type="color" value="#ffffff" />
                <input id="bg-hex" type="text" value="#ffffff" />
              </div>
            </div>
          </div>

          <div>
            <label>顏色預設</label>
            <div class="presets" id="presets"></div>
          </div>

          <div class="field">
            <div class="row">
              <label for="size">尺寸</label>
              <span class="count" id="size-label">300 px</span>
            </div>
            <input id="size" type="range" min="160" max="800" step="10" value="300" />
          </div>

          <div>
            <label>錯誤修正</label>
            <div class="ecc">
              <label class="ecc-opt"><input type="radio" name="ecc" value="L" /><span>低</span><small>L</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="M" checked /><span>中</span><small>M</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="Q" /><span>高</span><small>Q</small></label>
              <label class="ecc-opt"><input type="radio" name="ecc" value="H" /><span>最高</span><small>H</small></label>
            </div>
            <p class="hint">放中間圖片時建議使用「高」或「最高」。</p>
          </div>

          <div>
            <label>模組樣式</label>
            <div class="style-grid">
              <label class="style-opt"><input type="radio" name="style" value="square" checked />方塊</label>
              <label class="style-opt"><input type="radio" name="style" value="rounded" />圓角</label>
              <label class="style-opt"><input type="radio" name="style" value="dots" />圓點</label>
            </div>
          </div>

          <div class="field">
            <label>中間圖片（可選）</label>
            <div class="img-row">
              <img id="img-preview" class="img-preview" alt="" />
              <button type="button" class="btn btn-ghost" id="btn-img">選擇圖片</button>
              <button type="button" class="btn btn-ghost" id="btn-clear-img" disabled>清除</button>
              <input type="file" id="img-input" accept="image/*" hidden />
            </div>
          </div>

          <p class="alert warn" id="contrast-warn" hidden>前景與背景對比偏低。</p>
          <p class="alert err" id="error" hidden></p>
        </div>
      </section>

      <section class="card preview">
        <div class="preview-head">
          <h2>即時預覽</h2>
          <p class="count" id="dim">—</p>
        </div>
        <div class="stage">
          <canvas id="qr" width="300" height="300" style="display:none"></canvas>
          <p class="empty" id="empty">輸入文字後會顯示 QR 碼</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="download" disabled style="width:100%">下載 PNG</button>
        </div>
        <p class="hint" style="margin-top:12px">純前端 · 完整支援中文</p>
      </section>
    </main>
    <footer>方印工房</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function() {
      const PRESETS = [
        { name: "墨紙", fg: "#1c1915", bg: "#ffffff" },
        { name: "經典", fg: "#000000", bg: "#ffffff" },
        { name: "反白", fg: "#faf8f3", bg: "#1c1915" },
        { name: "松青", fg: "#1e3d36", bg: "#f3f6f4" }
      ];

      const $ = id => document.getElementById(id);
      const contentEl = $("content");
      const countEl = $("count");
      const fgEl = $("fg");
      const bgEl = $("bg");
      const fgHex = $("fg-hex");
      const bgHex = $("bg-hex");
      const sizeEl = $("size");
      const sizeLabel = $("size-label");
      const canvas = $("qr");
      const emptyEl = $("empty");
      const downloadBtn = $("download");
      const dimEl = $("dim");
      const errorEl = $("error");
      const warnEl = $("contrast-warn");
      const imgInput = $("img-input");
      const imgPreview = $("img-preview");
      const btnImg = $("btn-img");
      const btnClearImg = $("btn-clear-img");
      const presetsEl = $("presets");

      let centerImg = null;

      PRESETS.forEach(p => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.innerHTML = `<span class="dot" style="background:${p.fg};box-shadow:inset 0 0 0 3px ${p.bg}"></span>${p.name}`;
        btn.onclick = () => {
          fgEl.value = fgHex.value = p.fg;
          bgEl.value = bgHex.value = p.bg;
          render();
        };
        presetsEl.appendChild(btn);
      });

      function getRadio(name) {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        return el ? el.value : null;
      }

      function render() {
        const text = contentEl.value;
        countEl.textContent = text.length + " 字";
        const size = parseInt(sizeEl.value, 10) || 300;
        sizeLabel.textContent = size + " px";

        if (!text.trim()) {
          canvas.style.display = "none";
          emptyEl.style.display = "block";
          downloadBtn.disabled = true;
          dimEl.textContent = "—";
          errorEl.hidden = true;
          return;
        }

        emptyEl.style.display = "none";
        errorEl.hidden = true;

        let ecc = getRadio("ecc") || "M";
        if (centerImg && (ecc === "L" || ecc === "M")) ecc = "H";

        const fg = fgEl.value;
        const bg = bgEl.value;

        // contrast check
        function lum(hex) {
          const c = parseInt(hex.slice(1), 16);
          const r = ((c >> 16) & 255) / 255, g = ((c >> 8) & 255) / 255, b = (c & 255) / 255;
          const f = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
        }
        const ratio = (Math.max(lum(fg), lum(bg)) + 0.05) / (Math.min(lum(fg), lum(bg)) + 0.05);
        warnEl.hidden = ratio >= 3;

        // Important: set canvas size before calling the library
        canvas.width = size;
        canvas.height = size;

        QRCode.toCanvas(canvas, text, {
          width: size,
          margin: 2,
          color: { dark: fg, light: bg },
          errorCorrectionLevel: ecc
        }, function(err) {
          if (err) {
            console.error(err);
            errorEl.textContent = "產生失敗: " + (err.message || String(err));
            errorEl.hidden = false;
            canvas.style.display = "none";
            emptyEl.style.display = "block";
            downloadBtn.disabled = true;
            return;
          }

          // Center image overlay
          if (centerImg && centerImg.complete && centerImg.naturalWidth > 0) {
            const ctx = canvas.getContext("2d");
            const imgSize = Math.floor(size * 0.26);
            const x = (size - imgSize) / 2;
            const y = (size - imgSize) / 2;
            const pad = 8;
            ctx.fillStyle = bg;
            ctx.beginPath();
            const r = 10;
            ctx.moveTo(x - pad + r, y - pad);
            ctx.arcTo(x - pad + imgSize + pad * 2, y - pad, x - pad + imgSize + pad * 2, y - pad + imgSize + pad * 2, r);
            ctx.arcTo(x - pad + imgSize + pad * 2, y - pad + imgSize + pad * 2, x - pad, y - pad + imgSize + pad * 2, r);
            ctx.arcTo(x - pad, y - pad + imgSize + pad * 2, x - pad, y - pad, r);
            ctx.arcTo(x - pad, y - pad, x - pad + imgSize + pad * 2, y - pad, r);
            ctx.closePath();
            ctx.fill();
            ctx.drawImage(centerImg, x, y, imgSize, imgSize);
          }

          canvas.style.display = "block";
          downloadBtn.disabled = false;
          dimEl.textContent = size + " × " + size;
        });
      }

      contentEl.addEventListener("input", render);
      sizeEl.addEventListener("input", render);
      fgEl.addEventListener("input", () => { fgHex.value = fgEl.value; render(); });
      bgEl.addEventListener("input", () => { bgHex.value = bgEl.value; render(); });
      fgHex.addEventListener("change", () => { if (/^#[0-9a-fA-F]{6}$/.test(fgHex.value)) { fgEl.value = fgHex.value; render(); } });
      bgHex.addEventListener("change", () => { if (/^#[0-9a-fA-F]{6}$/.test(bgHex.value)) { bgEl.value = bgHex.value; render(); } });
      document.querySelectorAll('input[name="ecc"], input[name="style"]').forEach(el => el.addEventListener("change", render));

      btnImg.onclick = () => imgInput.click();
      imgInput.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          centerImg = img;
          imgPreview.src = url;
          imgPreview.classList.add("show");
          btnClearImg.disabled = false;
          render();
        };
        img.src = url;
      };
      btnClearImg.onclick = () => {
        centerImg = null;
        imgPreview.src = "";
        imgPreview.classList.remove("show");
        btnClearImg.disabled = true;
        imgInput.value = "";
        render();
      };

      downloadBtn.onclick = () => {
        const a = document.createElement("a");
        a.download = "qrcode.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      };

      // initial
      render();
    })();
  </script>
</body>
</html>
